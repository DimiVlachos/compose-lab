version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # Kotlin, Compose Multiplatform and SKIE move in lockstep; one PR keeps them building.
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "co.touchlab.skie*"
      androidx:
        patterns:
          - "androidx.*"
          - "com.android.*"
      others:
        patterns:
          - "*"
    ignore:
      # Held at 1.11: under Compose Multiplatform 1.12.1, Material 3 1.9's text fields throw as
      # their screen is disposed (Moodboard's board editor). Lift this once a fixed release is out.
      - dependency-name: "org.jetbrains.compose*"
        versions: ["1.12.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
