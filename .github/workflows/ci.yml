name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Static analysis, tests and debug build
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          # The Gradle daemon's JDK, vendor and version as in gradle/gradle-daemon-jvm.properties.
          # Android code still compiles to Java 17 bytecode.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Formatting (Spotless)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Tests (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Tests (Konsist architecture)
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Build iOS app (simulator)
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate --quiet
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Moodboard tests (iOS simulator)
        run: ./gradlew :moodboard:shared:iosSimulatorArm64Test --stacktrace

      # Links the framework the SwiftUI app imports, which runs SKIE's Swift generation: a
      # Kotlin or SKIE change that breaks it fails here, not first in Xcode.
      - name: Moodboard iOS framework
        run: ./gradlew :moodboard:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Moodboard architecture (Konsist)
        run: ./gradlew :moodboard:androidApp:testDebugUnitTest --stacktrace

      - name: Moodboard debug APK
        run: ./gradlew :moodboard:androidApp:assembleDebug --stacktrace

      - name: Moodboard Android lint
        run: ./gradlew :moodboard:androidApp:lintDebug --stacktrace

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            composeApp/build/reports/tests/**
            composeApp/build/test-results/**
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
            moodboard/*/build/reports/tests/**
            moodboard/*/build/test-results/**
            androidApp/build/reports/lint-results-*.html
            moodboard/androidApp/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
