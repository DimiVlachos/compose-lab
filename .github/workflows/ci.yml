name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The shared tests on the JVM, drawing with the same Skia as iOS, split over three machines.
  jvm-tests:
    name: Shared tests (JVM, ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          # The Gradle daemon's JDK, vendor and version as in gradle/gradle-daemon-jvm.properties.
          # Android code still compiles to Java 17 bytecode.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Shared tests (JVM)
        run: ./gradlew :composeApp:jvmTest -PtestShards=3 -PtestShard=${{ matrix.shard }} --stacktrace

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports-${{ matrix.shard }}
          path: |
            composeApp/build/reports/tests/**
            composeApp/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # Formatting, the architecture tests, and the Android apps built and linted.
  android:
    name: Formatting, Konsist, Android build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          # The Gradle daemon's JDK, vendor and version as in gradle/gradle-daemon-jvm.properties.
          # Android code still compiles to Java 17 bytecode.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Formatting (Spotless)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Tests (Konsist architecture)
        run: ./gradlew :androidApp:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug --stacktrace

      - name: Moodboard architecture (Konsist)
        run: ./gradlew :moodboard:androidApp:testDebugUnitTest --stacktrace

      - name: Moodboard debug APK
        run: ./gradlew :moodboard:androidApp:assembleDebug --stacktrace

      - name: Moodboard Android lint
        run: ./gradlew :moodboard:androidApp:lintDebug --stacktrace

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            androidApp/build/reports/tests/**
            androidApp/build/test-results/**
            moodboard/*/build/reports/tests/**
            moodboard/*/build/test-results/**
            androidApp/build/reports/lint-results-*.html
            moodboard/androidApp/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore

  # The iOS apps build, and Moodboard's tests run in the iOS simulator.
  ios:
    name: iOS build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          # The Gradle daemon's JDK, vendor and version as in gradle/gradle-daemon-jvm.properties.
          # Android code still compiles to Java 17 bytecode.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS app (simulator)
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate --quiet
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Moodboard tests (iOS simulator)
        run: ./gradlew :moodboard:shared:iosSimulatorArm64Test --stacktrace

      # Links the framework the SwiftUI app imports, which runs SKIE's Swift generation: a
      # Kotlin or SKIE change that breaks it fails here, not first in Xcode.
      - name: Moodboard iOS framework
        run: ./gradlew :moodboard:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            moodboard/*/build/reports/tests/**
            moodboard/*/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # The whole shared suite in the iOS simulator, as the app runs it, with the tests only iOS can
  # run (frozen textures, the glass shader, the bookshelf's font resolver, the camera): on main
  # and by hand, not on every pull request, where the JVM covers the shared tests far faster.
  ios-suite:
    name: Shared tests (iOS simulator)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          # The Gradle daemon's JDK, vendor and version as in gradle/gradle-daemon-jvm.properties.
          # Android code still compiles to Java 17 bytecode.
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Shared tests (iOS simulator)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Upload Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-suite-reports
          path: |
            composeApp/build/reports/tests/**
            composeApp/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # The check main's ruleset requires: it passes only when every job above it passes.
  checks:
    name: Static analysis, tests and debug build
    if: always()
    needs: [jvm-tests, android, ios]
    runs-on: ubuntu-latest

    steps:
      - name: Every job passed
        run: |
          test "${{ needs.jvm-tests.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.ios.result }}" = success
