name: Release

on:
  push:
    branches:
      - main
    paths:
      - gradle/libs.versions.toml
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # When app-versionName on main names a version that has no tag yet, tag that commit and
  # publish a GitHub release whose notes are the version's section of CHANGELOG.md.
  release:
    name: Tag and release a new version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^app-versionName = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          tag="v$version"
          if [[ -z "$version" ]]; then
            echo "::error::No app-versionName in gradle/libs.versions.toml"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi

          # The section runs from its heading to the next version heading or the link references.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "compose-lab $version"
          git push origin "$tag"
          gh release create "$tag" --title "compose-lab $version" --notes-file notes.md --verify-tag
