name: Moodboard
targets:
  Moodboard:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Moodboard
      # The brand display face, shared with the Compose screens (shared composeResources).
      - path: ../shared/src/commonMain/composeResources/font/instrument_serif_regular.ttf
        buildPhase: resources
    info:
      path: Moodboard/Info.plist
      properties:
        CFBundleDisplayName: Moodboard
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIAppFonts:
          - instrument_serif_regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimvlachos.moodboard
        # iPhone only: the app is portrait-only, which iPad multitasking doesn't allow.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The brand's Aegean blue (light and dark), the app-wide tint.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework MoodboardShared
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home)}"
          cd "$SRCROOT/../.."
          ./gradlew :moodboard:shared:embedAndSignAppleFrameworkForXcode
  MoodboardUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MoodboardUITests
    dependencies:
      - target: Moodboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dimvlachos.moodboard.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Moodboard:
    build:
      targets:
        Moodboard: all
        MoodboardUITests: [test]
    test:
      targets:
        - MoodboardUITests
