[versions]
a2ui = "1.0.0-alpha01"
activityCompose = "1.13.0"
anthropicJava = "2.66.0"
openaiJava = "4.70.0"
agp = "9.3.1"
android-compileSdk = "37"
android-minSdk = "31"
android-targetSdk = "36"
composeMultiplatform = "1.11.1"
cmpMaterial3 = "1.9.0"
coreKtx = "1.19.0"
coreI18n = "1.0.0"
coroutines = "1.11.0"
gson = "2.14.0"
junit = "4.13.2"
kermit = "2.1.0"
konsist = "0.17.3"
kotlin = "2.4.10"
lifecycle = "2.10.0"
orgJson = "20260814"
navigationEvent = "1.0.1"
spotless = "8.9.0"

[libraries]
a2ui-compose-runtime = { module = "androidx.a2ui.compose:compose-runtime", version.ref = "a2ui" }
a2ui-compose-ui = { module = "androidx.a2ui.compose:compose-ui", version.ref = "a2ui" }
a2ui-engine = { module = "androidx.a2ui:a2ui-engine", version.ref = "a2ui" }
a2ui-material3 = { module = "androidx.compose.material3:material3-a2ui", version.ref = "a2ui" }
a2ui-model = { module = "androidx.a2ui:a2ui-model", version.ref = "a2ui" }
androidx-core-i18n = { module = "androidx.core:core-i18n", version.ref = "coreI18n" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
openai-java = { module = "com.openai:openai-java", version.ref = "openaiJava" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropicJava" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
cmp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "cmpMaterial3" }
cmp-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
cmp-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
cmp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationEvent" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
